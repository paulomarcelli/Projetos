[project]
name = "hela"
version = "0.3.0"
description = "HELA: memória cognitiva local (cérebro externo) para o Claude Code"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26,<3",
  "networkx>=3.2,<4",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
# Opcional: embeddings neurais no lugar do hashing (ver docs/arquitetura.md).
neural = ["sentence-transformers>=3,<6"]

[project.scripts]
hela = "hela.cli:main"
hela-mcp = "hela.integration.mcp_server:main"
hela-hook = "hela.integration.hooks:main"
hela-api = "hela.api.server:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hela*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
