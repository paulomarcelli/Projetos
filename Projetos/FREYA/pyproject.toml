[project]
name = "freya"
version = "0.1.0"
description = "F.R.E.Y.A. — inteligência prospectiva sobre o MCU (Hybrid RAG + GraphRAG + motor prospectivo)"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "qdrant-client==1.13.2",
  "elasticsearch==8.17.1",
  "neo4j==5.28.1",
  "sentence-transformers==3.4.1",
  "openai>=1.60,<2",
  "rank-bm25>=0.2.2,<0.3",
  "networkx>=3.3,<4",
  "beautifulsoup4>=4.12,<5",
  "lxml>=5,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[project.scripts]
freya = "freya.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integracao: precisa de Qdrant, Elasticsearch e Neo4j rodando (docker compose up -d)"]
addopts = "-m 'not integracao'"
