# Serviços da F.R.E.Y.A. (os mesmos da entrega da Manus): Qdrant, Elasticsearch e Neo4j.
# A senha do Neo4j vem do .env (NEO4J_PASSWORD); nenhuma senha fica neste arquivo.
services:
  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports: ["6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.2
    ports: ["9200:9200"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      # desenvolvimento: não bloqueia a escrita quando o disco está quase cheio
      cluster.routing.allocation.disk.threshold_enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes: [es_data:/usr/share/elasticsearch/data]
  neo4j:
    image: neo4j:5.26-community
    ports: ["7474:7474", "7687:7687"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?defina NEO4J_PASSWORD no .env}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    volumes: [neo4j_data:/data]
volumes:
  qdrant_data:
  es_data:
  neo4j_data:
