name: Publicar os sites no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Preparar o Node (landing page Karol Sevilla)
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Gerar a landing page Karol Sevilla (Vite)
        working-directory: Projetos/landing page Karol Sevilla
        run: |
          npm ci
          npm run build
      - name: Gerar a landing Karol x Samsung (Vite + Three.js)
        working-directory: Projetos/landing page Karol Sevilla x Samsung
        run: |
          npm ci
          npm run build
      - name: Montar os sites
        run: |
          rm -rf _site
          mkdir -p _site/Projetos/Cenicienta _site/Projetos/Una-Noche-Mas _site/Projetos/Role-peoes
          cp -a Projetos/Site-Karol-Sevilla/. _site/
          cp -a Projetos/Cenicienta/. _site/Projetos/Cenicienta/
          cp -a Projetos/Una-Noche-Mas/. _site/Projetos/Una-Noche-Mas/
          cp -a Projetos/Role-peoes/. _site/Projetos/Role-peoes/
          mkdir -p _site/Projetos/Geometry-Heroes
          # Geometry Heroes: só o que o jogo precisa para rodar (sem testes, vídeo e documentação)
          cp -a Projetos/Tarefa-POO-JavaScript/index.html Projetos/Tarefa-POO-JavaScript/main.js Projetos/Tarefa-POO-JavaScript/style.css Projetos/Tarefa-POO-JavaScript/js Projetos/Tarefa-POO-JavaScript/assets _site/Projetos/Geometry-Heroes/
          # LUNA MIND: só o frontend (web/). O servidor (Flask) não roda no Pages; o endereço dele vem da
          # variável LUNA_API_URL do repositório. Sem ela, a página avisa que as respostas estão indisponíveis.
          mkdir -p _site/Projetos/Luna
          cp -a Projetos/Luna-AI/web/. _site/Projetos/Luna/
          printf 'window.LUNA_CONFIG = { apiBase: %s };\n' "$(jq -Rn --arg u "$LUNA_API_URL" '$u')" > _site/Projetos/Luna/config.js
          # Cache: cada publicação usa uma versão nova dos scripts, para o navegador não ficar com a página antiga
          sed -i "s#\\(src=\"\\(config\\|script\\|voz\\|voz-tempo-real\\|intro\\|estrelas\\)\\.js\\)\"#\\1?v=${GITHUB_SHA::8}\"#g; s#href=\"style.css\"#href=\"style.css?v=${GITHUB_SHA::8}\"#" _site/Projetos/Luna/index.html
          # Landing page Karol Sevilla: só o resultado do build (dist/)
          mkdir -p _site/Projetos/Landing-Page-Karol-Sevilla
          cp -a "Projetos/landing page Karol Sevilla/dist/." _site/Projetos/Landing-Page-Karol-Sevilla/
          # Landing Karol x Samsung: só o resultado do build (dist/)
          mkdir -p _site/Projetos/Karol-x-Samsung
          cp -a "Projetos/landing page Karol Sevilla x Samsung/dist/." _site/Projetos/Karol-x-Samsung/
          touch _site/.nojekyll
        env:
          # Servidor da Luna no Render. A variável LUNA_API_URL do repositório, se existir, tem prioridade.
          LUNA_API_URL: ${{ vars.LUNA_API_URL || 'https://luna-mind.onrender.com' }}
      - name: Preparar arquivos dos sites
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
