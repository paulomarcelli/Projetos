<svg xmlns="http://www.w3.org/2000/svg" width="900" height="64" viewBox="0 0 900 64" role="img" aria-label="Grimório de projetos">
<style>
.giro{animation:giro 60s linear infinite} .giro2{animation:giro 90s linear infinite reverse}
@keyframes giro{to{transform:rotate(360deg)}}
.fio{fill:none;stroke-linecap:round;stroke-dasharray:60 600;animation:fio 7s linear infinite;opacity:.0}
@keyframes fio{0%{stroke-dashoffset:660;opacity:0}15%{opacity:.8}85%{opacity:.6}100%{stroke-dashoffset:0;opacity:0}}
.faisca{animation:faisca 5s ease-in infinite;opacity:0}
@keyframes faisca{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-140px);opacity:0}}
.pulsa{animation:pulsa 4s ease-in-out infinite} @keyframes pulsa{50%{opacity:.55}}
.tremor{animation:tremor 6s steps(1) infinite}
@keyframes tremor{0%,88%,100%{transform:none;opacity:1}89%{transform:translate(3px,-1px) skewX(-6deg);opacity:.8}90%{transform:translate(-4px,1px);opacity:1}91%{transform:translate(2px,0) skewX(4deg)}92%{transform:none}}
.rgb{animation:rgb 6s steps(1) infinite;opacity:0} @keyframes rgb{0%,88%,93%,100%{opacity:0}89%,91%{opacity:.7}}
</style><defs>
<radialGradient id="aura" cx="50%" cy="55%" r="60%"><stop offset="0" stop-color="#ff1f3d" stop-opacity=".45"/><stop offset=".45" stop-color="#7a0a1c" stop-opacity=".25"/><stop offset="1" stop-color="#0a0204" stop-opacity="0"/></radialGradient>
<filter id="brilho" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="brilhoForte" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
<linearGradient id="letra" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe3e8"/><stop offset=".55" stop-color="#ff4d6d"/><stop offset="1" stop-color="#ff1f3d"/></linearGradient>
</defs>
