<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aurora — protótipo</title>
  <style>html, body { margin: 0; height: 100%; background: #1b1533; overflow: hidden; } #jogo { width: 100%; height: 100%; }</style>
</head>
<body>
  <div id="jogo"></div>
  <script type="module">
    // ?fase=prologo ou ?fase=1. Sem nada: o Prólogo na primeira vez, a Fase 1 depois que ele foi visto.
    const pedida = new URLSearchParams(location.search).get('fase');
    let visto = false;
    try { visto = localStorage.getItem('aurora_prologo') === 'feito'; } catch { /* sem armazenamento */ }
    const fase = pedida ?? (visto ? '1' : 'prologo');
    import(fase === 'prologo' ? './src/prologo.js' : './src/main.js');
  </script>
</body>
</html>
