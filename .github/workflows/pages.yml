name: Publicar Site Karol Sevilla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Montar os dois sites originais
        run: |
          rm -rf _site
          mkdir -p _site/Projetos/Cenicienta
          cp -a Projetos/Site-Karol-Sevilla/. _site/
          cp -a Projetos/Cenicienta/. _site/Projetos/Cenicienta/
          touch _site/.nojekyll
      - name: Preparar arquivos dos dois sites
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
